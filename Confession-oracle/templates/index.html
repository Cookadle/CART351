<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <title>The Confession Oracle</title>
</head>

<body>
  <header></header>

  <main class="container">
    <h1>Confess to us something you never said, oh you fortunate one.</h1>

    <form id="confession-form">
      <label for="confession-input">Your confession dear... </label>
      <textarea id="confession-input" name="text" rows="4" maxlength="500"
        placeholder="Tell me a secret,a sin ,a regret...." required></textarea>

      <button type="submit"> Confess! </button>

      <p id="status-message" aria-live="polite"></p>

      <section id="oracle-section">
        <button type="button" id="oracle-button"> Seek fortune from the all-knowing seer ,the Oracle.</button>
        <div id="oracle-output" aria-live="polite"></div>

      </section>
  </main>

  <footer>
    <p class="disclaimer">
      Visions and omens are not assured and may shift from soul to soul. Thou alone are the master of thy own path,
      deeds, and choices. No oaths are sworn regarding the truth or days yet to come of any fortune.
    </p>
    </form>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
