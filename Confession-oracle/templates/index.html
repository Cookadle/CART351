<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <title>The Confession Oracle</title>
  </head>
  <body>
    <header></header>

    <main class="container">
      <h1>Tell me something you never said.</h1>

      <form id="confession-form">
        <label for="confession-input">Your confession</label>
        <textarea
          id="confession-input"
          name="text"
          rows="4"
          maxlength="500"
          placeholder="Type what you haven't said out loud..."
          required
        ></textarea>

        <button type="submit">Confess</button>
      

      <p id="status-message" aria-live="polite"></p>
    </main>

    <footer>
      <p class="disclaimer">
        Oracle is not responsible for any harm or injuries caused. Always
        consult a certified human before making any drastic changes to
        yourself.
      </p>
      </form>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  </body>
</html>
